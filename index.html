<!doctype html>
<html lang="pt-BR" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ayne em duas luzes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Um site feito à mão para a Ayne: as nossas fotografias sob duas luzes, a do poste à noite e a do céu azul de um dia de praia, com uma carta no meio.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0a08">
<meta name="color-scheme" content="dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Ayne em duas luzes">
<meta property="og:description" content="Fotografias, uma carta e alguns segredos.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -50 100 100'%3E%3Cdefs%3E%3Cg id='f'%3E%3Ccircle cy='-6.4' r='6.4'/%3E%3Ccircle cx='6.4' r='6.4'/%3E%3Ccircle cy='6.4' r='6.4'/%3E%3Ccircle cx='-6.4' r='6.4'/%3E%3C/g%3E%3C/defs%3E%3Cg fill='%23e6b42c'%3E%3Cuse href='%23f' transform='translate(0 -26) rotate(20)'/%3E%3Cuse href='%23f' transform='translate(22.5 -13) rotate(60)'/%3E%3Cuse href='%23f' transform='translate(22.5 13) rotate(10)'/%3E%3Cuse href='%23f' transform='translate(0 26) rotate(40)'/%3E%3Cuse href='%23f' transform='translate(-22.5 13) rotate(75)'/%3E%3Cuse href='%23f' transform='translate(-22.5 -13) rotate(30)'/%3E%3C/g%3E%3Cuse href='%23f' fill='%23d9772b' transform='rotate(45) scale(.92)'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/instrument-serif-400-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/hanken-grotesk-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.className = 'js';</script>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<!-- Ícones: a flor amarela (cambada de florzinhas de quatro pétalas), setas e coração -->
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="i-florzinha">
      <circle cx="0" cy="-6.4" r="6.4"/><circle cx="6.4" cy="0" r="6.4"/><circle cx="0" cy="6.4" r="6.4"/><circle cx="-6.4" cy="0" r="6.4"/>
    </g>
    <symbol id="i-flor" viewBox="-50 -50 100 100">
      <g style="fill: var(--petala, #e6b42c)">
        <use href="#i-florzinha" transform="translate(0 -26) rotate(20)"/>
        <use href="#i-florzinha" transform="translate(22.5 -13) rotate(60)"/>
        <use href="#i-florzinha" transform="translate(22.5 13) rotate(10)"/>
        <use href="#i-florzinha" transform="translate(0 26) rotate(40)"/>
        <use href="#i-florzinha" transform="translate(-22.5 13) rotate(75)"/>
        <use href="#i-florzinha" transform="translate(-22.5 -13) rotate(30)"/>
      </g>
      <g style="fill: var(--miolo, #d9772b)"><use href="#i-florzinha" transform="rotate(45) scale(.92)"/></g>
      <g style="fill: var(--centro, #8c3b12)">
        <circle cx="0" cy="-26" r="2.1"/><circle cx="22.5" cy="-13" r="2.1"/><circle cx="22.5" cy="13" r="2.1"/>
        <circle cx="0" cy="26" r="2.1"/><circle cx="-22.5" cy="13" r="2.1"/><circle cx="-22.5" cy="-13" r="2.1"/><circle r="2.3"/>
      </g>
    </symbol>
    <symbol id="i-seta" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-coracao" viewBox="0 0 24 24"><path d="M12 20.3s-7.4-4.5-7.4-10.1A4.2 4.2 0 0 1 12 7.5a4.2 4.2 0 0 1 7.4 2.7c0 5.6-7.4 10.1-7.4 10.1z" style="fill: var(--recheio, none)" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="grao" aria-hidden="true"></div>

<!-- ================================================================
     3.1 ABERTURA — uma luz no escuro; ao abrir, vira uma íris
     ================================================================ -->
<div class="abertura" id="abertura" role="dialog" aria-modal="true" aria-labelledby="aberturaFrase">
  <div class="abertura__brilho" aria-hidden="true"></div>
  <div class="abertura__luz" aria-hidden="true"></div>
  <p class="abertura__progresso rotulo" aria-hidden="true"><span id="aberturaPct">00</span><span data-c="abertura.carregando"></span></p>
  <div class="abertura__texto">
    <p class="abertura__saudacao rotulo" id="aberturaSaudacao"></p>
    <p class="abertura__frase" id="aberturaFrase"><span class="linha" data-c="abertura.frase"></span> <span class="linha" data-c="abertura.complemento"></span></p>
    <div class="abertura__acoes">
      <button class="botao botao--luz" id="aberturaBotao" type="button"><span data-c="abertura.botao"></span></button>
      <button class="abertura__som" id="aberturaSom" type="button" aria-pressed="true" hidden><i aria-hidden="true"></i><span id="aberturaSomTexto"></span></button>
    </div>
  </div>
</div>

<!-- Topo -->
<header class="topo" id="topo">
  <a class="topo__marca" href="#inicio" aria-label="Voltar ao início"><svg class="icone-flor" aria-hidden="true"><use href="#i-flor"/></svg><span data-c="nome"></span></a>
  <p class="topo__secao rotulo" id="topoSecao"></p>
  <button class="topo__menu" id="menuAbrir" type="button" aria-expanded="false" aria-controls="menu"><span data-c="prologo.sumario"></span></button>
</header>
<span class="progresso" id="progresso" aria-hidden="true"></span>

<nav class="menu" id="menu" aria-labelledby="menuTitulo" hidden>
  <div class="menu__barra">
    <p class="rotulo" id="menuTitulo" data-c="prologo.sumario"></p>
    <button class="menu__fechar rotulo" id="menuFechar" type="button">fechar</button>
  </div>
  <ol class="menu__lista" id="menuLista"></ol>
  <p class="menu__rodape rotulo"><span data-c="nome"></span> · <span data-c="inicio.texto"></span></p>
</nav>

<main id="conteudo">

  <!-- ================================================================
       3.2 HERO — ela, o mirante e o céu inteiro
       ================================================================ -->
  <section class="hero" id="inicio" data-secao="inicio" data-cor="#3e72c0" aria-labelledby="heroNome" tabindex="-1">
    <figure class="hero__foto" data-foto="hero.foto" data-estatica data-sem-legenda data-prioridade></figure>
    <div class="hero__conteudo">
      <p class="hero__para rotulo" data-c="hero.rotulo"></p>
      <h1 class="hero__nome" id="heroNome"><span data-c="nome"></span></h1>
      <p class="hero__sub" data-c="hero.subtitulo"></p>
      <div class="hero__meta" id="heroMeta">
        <span class="rotulo" data-c="inicio.texto"></span>
        <button class="hero__contador rotulo" id="contador" type="button" title="Toque para trocar a unidade"></button>
      </div>
    </div>
    <p class="hero__placa rotulo" id="heroPlaca" aria-hidden="true"></p>
    <a class="hero__rolar rotulo" href="#prologo"><span data-c="hero.rolar"></span><i aria-hidden="true"></i></a>
  </section>

  <!-- Prólogo + sumário, no crepúsculo -->
  <section class="prologo" id="prologo" data-secao="prologo" data-cor="#1c2c55" aria-labelledby="prologoRotulo" tabindex="-1">
    <div class="prologo__dentro wrap">
      <p class="rotulo prologo__rotulo" id="prologoRotulo" data-c="prologo.rotulo" data-revelar></p>
      <p class="prologo__texto" data-c="prologo.texto" data-dividir></p>
      <nav class="sumario" aria-labelledby="sumarioTitulo" data-revelar>
        <p class="rotulo" id="sumarioTitulo" data-c="prologo.sumario"></p>
        <ol class="sumario__lista" id="sumarioLista"></ol>
      </nav>
    </div>
  </section>

  <!-- ================================================================
       3.3 UMA HISTÓRIA EM FOTOGRAFIAS
       ================================================================ -->

  <!-- I · Luz de poste -->
  <section class="cap cap--luz" id="luz-de-poste" data-secao="capitulos.luz" data-cor="#0d0a08" aria-labelledby="luzTitulo" tabindex="-1">
    <div class="bokeh" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <header class="cap__cabeca wrap">
      <span class="cap__num" aria-hidden="true" data-c="capitulos.luz.numero"></span>
      <p class="rotulo cap__rotulo" data-c="capitulos.luz.rotulo" data-revelar></p>
      <h2 class="cap__titulo" id="luzTitulo" data-c="capitulos.luz.titulo" data-dividir></h2>
      <p class="cap__texto" data-c="capitulos.luz.texto" data-revelar></p>
    </header>
    <div class="cap__corpo wrap luz">
      <figure class="luz__a" data-foto="capitulos.luz.fotos.0" data-paralaxe=".07"></figure>
      <figure class="luz__b" data-foto="capitulos.luz.fotos.1"></figure>
      <figure class="luz__c" data-foto="capitulos.luz.fotos.2" data-paralaxe=".05"></figure>
      <blockquote class="citacao luz__citacao" data-revelar><p data-c="capitulos.luz.citacao"></p></blockquote>
      <figure class="foto--celular luz__d" data-foto="capitulos.luz.fotos.3"></figure>
      <button class="flor-secreta luz__flor" type="button" data-flor="1" aria-label="Uma flor escondida"><svg aria-hidden="true"><use href="#i-flor"/></svg></button>
    </div>
  </section>

  <!-- II · Flor amarela: começa no close da flor e abre até a foto inteira -->
  <section class="cap cap--flor" id="flor-amarela" data-secao="capitulos.flor" data-cor="#100c08" aria-labelledby="florTitulo" tabindex="-1">
    <div class="petalas" aria-hidden="true"><svg><use href="#i-flor"/></svg><svg><use href="#i-flor"/></svg><svg><use href="#i-flor"/></svg><svg><use href="#i-flor"/></svg><svg><use href="#i-flor"/></svg></div>
    <header class="cap__cabeca wrap">
      <span class="cap__num" aria-hidden="true" data-c="capitulos.flor.numero"></span>
      <p class="rotulo cap__rotulo" data-c="capitulos.flor.rotulo" data-revelar></p>
      <h2 class="cap__titulo" id="florTitulo" data-c="capitulos.flor.titulo" data-dividir></h2>
      <p class="cap__texto" data-c="capitulos.flor.texto" data-revelar></p>
    </header>
    <div class="zoom" id="zoom">
      <div class="zoom__palco">
        <figure class="zoom__foto" data-foto="capitulos.flor.fotos.0" data-estatica data-sem-legenda data-maior></figure>
        <div class="zoom__veu" aria-hidden="true"></div>
        <p class="zoom__texto zoom__texto--1" data-c="capitulos.flor.zoom1"></p>
        <p class="zoom__texto zoom__texto--2" data-c="capitulos.flor.zoom2"></p>
      </div>
    </div>
    <div class="cap__corpo wrap flor">
      <figure class="flor__a" data-foto="capitulos.flor.fotos.1"></figure>
      <p class="flor__nota" data-c="capitulos.flor.nota" data-revelar></p>
      <figure class="flor__b" data-foto="capitulos.flor.fotos.2" data-paralaxe=".06"></figure>
    </div>
  </section>

  <div class="passagem passagem--amanhecer" aria-hidden="true"><p data-c="capitulos.ceu.passagem" data-revelar></p></div>

  <!-- III · Céu azul -->
  <section class="cap cap--ceu" id="ceu-azul" data-secao="capitulos.ceu" data-cor="#2a5aa8" aria-labelledby="ceuTitulo" tabindex="-1">
    <div class="nuvens" aria-hidden="true"><i></i><i></i><i></i></div>
    <header class="cap__cabeca wrap">
      <span class="cap__num" aria-hidden="true" data-c="capitulos.ceu.numero"></span>
      <p class="rotulo cap__rotulo" data-c="capitulos.ceu.rotulo" data-revelar></p>
      <h2 class="cap__titulo" id="ceuTitulo" data-c="capitulos.ceu.titulo" data-dividir></h2>
      <p class="cap__texto" data-c="capitulos.ceu.texto" data-revelar></p>
      <button class="flor-secreta ceu__flor" type="button" data-flor="2" aria-label="Uma flor escondida"><svg aria-hidden="true"><use href="#i-flor"/></svg></button>
    </header>
    <div class="cap__corpo wrap ceu">
      <figure class="ceu__a" data-foto="capitulos.ceu.fotos.0" data-paralaxe=".06"></figure>
      <figure class="ceu__b" data-foto="capitulos.ceu.fotos.1"></figure>
      <blockquote class="citacao ceu__citacao" data-revelar><p data-c="capitulos.ceu.citacao"></p></blockquote>
      <figure class="ceu__c" data-foto="capitulos.ceu.fotos.2" data-paralaxe=".05"></figure>
    </div>
  </section>

  <div class="passagem passagem--anoitecer" aria-hidden="true"><p data-c="capitulos.jeito.passagem" data-revelar></p></div>

  <!-- IV · Do seu jeito -->
  <section class="cap cap--jeito" id="do-seu-jeito" data-secao="capitulos.jeito" data-cor="#111510" aria-labelledby="jeitoTitulo" tabindex="-1">
    <header class="cap__cabeca wrap">
      <span class="cap__num" aria-hidden="true" data-c="capitulos.jeito.numero"></span>
      <p class="rotulo cap__rotulo" data-c="capitulos.jeito.rotulo" data-revelar></p>
      <h2 class="cap__titulo" id="jeitoTitulo" data-c="capitulos.jeito.titulo" data-dividir></h2>
      <p class="cap__texto" data-c="capitulos.jeito.texto" data-revelar></p>
    </header>
    <div class="cap__corpo wrap jeito">
      <figure class="jeito__a" data-foto="capitulos.jeito.fotos.0"></figure>
      <figure class="jeito__b" data-foto="capitulos.jeito.fotos.1" data-paralaxe=".06"></figure>
      <figure class="jeito__v" data-foto="capitulos.jeito.fotos.2"></figure>
    </div>
  </section>

  <!-- ================================================================
       3.4 MOMENTOS — o cartão mostra um detalhe; ao tocar, a foto inteira
       ================================================================ -->
  <section class="momentos" id="momentos" data-secao="momentos" data-cor="#170a09" aria-labelledby="momentosTitulo" tabindex="-1">
    <header class="secao__cabeca wrap">
      <p class="rotulo" data-c="momentos.rotulo" data-revelar></p>
      <h2 class="secao__titulo" id="momentosTitulo" data-c="momentos.titulo" data-dividir></h2>
      <p class="secao__texto" data-c="momentos.texto" data-revelar></p>
    </header>
    <ul class="momentos__lista wrap" id="momentosLista"></ul>
  </section>

  <!-- ================================================================
       3.5 UMA CARTA
       ================================================================ -->
  <section class="carta" id="carta" data-secao="carta" data-cor="#0d0a08" aria-labelledby="cartaTitulo" tabindex="-1">
    <div class="carta__abajur" aria-hidden="true"></div>
    <header class="secao__cabeca secao__cabeca--centro wrap">
      <p class="rotulo" data-c="carta.rotulo" data-revelar></p>
      <h2 class="secao__titulo" id="cartaTitulo" data-c="carta.titulo" data-dividir></h2>
    </header>
    <div class="carta__mesa wrap">
      <div class="carta__envelope" data-revelar>
      <div class="envelope" id="envelope">
        <div class="envelope__costas"></div>
        <div class="envelope__papel" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="envelope__bolso"></div>
        <div class="envelope__aba"><div class="envelope__aba-frente"></div><div class="envelope__aba-verso"></div></div>
        <p class="envelope__para" data-c="carta.envelope"></p>
        <button class="envelope__selo" id="cartaAbrir" type="button" aria-controls="folha" aria-expanded="false" data-cursor="abrir">
          <svg aria-hidden="true"><use href="#i-flor"/></svg>
          <span class="sr" data-c="carta.instrucao"></span>
        </button>
      </div>
      </div>
      <p class="carta__instrucao rotulo" data-c="carta.instrucao" data-revelar></p>
      <article class="folha" id="folha" aria-labelledby="cartaTitulo" tabindex="-1" hidden>
        <p class="folha__data rotulo" data-c="carta.data"></p>
        <div class="folha__texto" id="folhaTexto"></div>
        <p class="folha__assinatura" id="folhaAssinatura" data-c="carta.assinatura"></p>
        <div class="folha__pe">
          <button class="folha__reler rotulo" id="cartaReler" type="button"><span data-c="carta.reler"></span></button>
          <button class="flor-secreta folha__flor" type="button" data-flor="3" aria-label="Uma flor escondida"><svg aria-hidden="true"><use href="#i-flor"/></svg></button>
        </div>
      </article>
    </div>
  </section>

  <!-- ================================================================
       3.6 PEQUENO INVENTÁRIO — detalhes recortados das fotos
       ================================================================ -->
  <section class="inventario" id="inventario" data-secao="inventario" data-cor="#15100c" aria-labelledby="inventarioTitulo" tabindex="-1">
    <header class="secao__cabeca wrap">
      <p class="rotulo" data-c="inventario.rotulo" data-revelar></p>
      <h2 class="secao__titulo" id="inventarioTitulo" data-c="inventario.titulo" data-dividir></h2>
      <p class="secao__texto" data-c="inventario.texto" data-revelar></p>
    </header>
    <ul class="inventario__lista wrap" id="inventarioLista"></ul>
  </section>

  <!-- ================================================================
       3.7 ARQUIVO — galeria editorial, à luz do dia
       ================================================================ -->
  <section class="arquivo" id="arquivo" data-secao="arquivo" data-cor="#e5e8ea" aria-labelledby="arquivoTitulo" tabindex="-1">
    <header class="secao__cabeca wrap">
      <p class="rotulo" data-c="arquivo.rotulo" data-revelar></p>
      <h2 class="secao__titulo" id="arquivoTitulo" data-c="arquivo.titulo" data-dividir></h2>
      <p class="secao__texto" id="arquivoTexto" data-revelar></p>
    </header>
    <ol class="arquivo__grade wrap" id="arquivoGrade"></ol>
    <div class="arquivo__nota wrap" data-revelar>
      <p data-c="arquivo.nota"></p>
      <button class="coracao" id="coracao" type="button" aria-label="Um coração escondido"><svg aria-hidden="true"><use href="#i-coracao"/></svg></button>
    </div>
  </section>

  <!-- ================================================================
       3.9 ENCERRAMENTO — o mesmo mirante, agora os dois; depois, a noite
       ================================================================ -->
  <section class="fim" id="fim" data-secao="fim" data-cor="#436bb1" aria-labelledby="fimFrase" tabindex="-1">
    <div class="fim__dia" id="fimDia">
      <figure class="fim__foto" data-foto="fim.foto" data-estatica data-sem-legenda></figure>
      <div class="fim__veu" id="fimVeu" aria-hidden="true"></div>
      <h2 class="fim__frase" id="fimFrase" data-c="fim.frase" data-dividir></h2>
    </div>
    <div class="fim__noite">
      <button class="fim__luz" id="fimLuz" type="button" aria-expanded="false" aria-controls="fimPs" aria-label="Uma luz acesa" data-cursor="tocar"><span></span></button>
      <p class="fim__dica rotulo" id="fimDica" data-c="fim.dicaLuz"></p>
      <p class="fim__ps" id="fimPs" data-c="fim.ps" hidden></p>
      <p class="fim__assinatura"><span aria-hidden="true">— </span><span data-c="fim.assinatura"></span></p>
      <div class="fim__musica" id="fimMusica">
        <p class="rotulo" data-c="musica.rotulo"></p>
        <p class="fim__musica-nome"><span data-c="musica.titulo"></span> <span class="fim__artista" data-c="musica.artista"></span></p>
        <p class="fim__links" id="fimLinks"></p>
      </div>
      <p class="fim__creditos rotulo" data-c="fim.creditos"></p>
      <a class="botao fim__voltar" href="#inicio"><span data-c="fim.voltar"></span></a>
    </div>
  </section>

</main>

<!-- Visor em tela cheia (momentos, arquivo e fotos da história) -->
<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Foto em tela cheia" hidden>
  <div class="visor__fundo"></div>
  <div class="visor__palco" id="visorPalco"></div>
  <div class="visor__barra">
    <span class="visor__contagem rotulo" id="visorContagem"></span>
    <button class="visor__fechar rotulo" id="visorFechar" type="button">fechar</button>
  </div>
  <button class="visor__nav visor__nav--ant" id="visorAnt" type="button" aria-label="Foto anterior"><svg aria-hidden="true"><use href="#i-seta"/></svg></button>
  <button class="visor__nav visor__nav--prox" id="visorProx" type="button" aria-label="Próxima foto"><svg aria-hidden="true"><use href="#i-seta"/></svg></button>
  <div class="visor__legenda" aria-live="polite">
    <p class="visor__titulo" id="visorTitulo"></p>
    <p class="visor__texto" id="visorTexto"></p>
  </div>
</div>

<!-- Música: só aparece se houver arquivo em assets/music/ -->
<button class="som" id="som" type="button" aria-pressed="false" hidden>
  <span class="som__barras" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  <span class="som__rotulo" id="somRotulo"></span>
</button>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>
<div class="cursor" id="cursor" aria-hidden="true"><span></span></div>
<div class="chuva" id="chuva" aria-hidden="true"></div>
